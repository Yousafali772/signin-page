<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Signup page</title>
</head> 
<body>
    <!-- Main Div  -->
    <div id="sign">
        <!-- First Div  -->
        <div class="sign1">
                 <!-- Para  -->
                <p>Getting 
                Started With 
                VR Creation</p>   
        </div>
        <!-- Second Div  -->
        <div class="sign2">
                <!-- Language  -->
             <div class="language">
                  <select name="language">
                    <option value="language" selected>English (UK)</option>
                    <option value="language">English (US)</option>
                    <option value="language">German</option>
                    <option value="language">Franch</option>
                  </select>
                </div>
             <!-- Header  -->
             <h1>Create Account</h1>
             <!-- Link Anchor -->
             <div class="anchor"><div class="img1">
                <img src="./assets/8c030bd6bd7ee87ad41485e3c7598dd4 1.png" alt="no image">
              <a href="https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Faccounts.google.com%2F&followup=https%3A%2F%2Faccounts.google.com%2F&ifkv=ARpgrqcFnSwSTC9H5GpiiqHMXtELn2ZmwYiHyVuvUFWH80twRBEjo5G7pgKFn1p_Ci_lQfx3qyOC8Q&passive=1209600&flowName=GlifWebSignIn&flowEntry=ServiceLogin&dsh=S-586364440%3A1726717307880096&ddm=0" target="_blank">Signup with Google</a>
             </div>
             <div class="img2">
                <img src="./assets/pngegg (69) 1 (1).png" alt="on image">
                 <a href="https://www.facebook.com/campaign/landing.php?campaign_id=1653377901&extra_1=s|c|318305677145|e|facebook%20login|&placement=&creative=318305677145&keyword=facebook%20login&partner_id=googlesem&extra_2=campaignid%3D1653377901%26adgroupid%3D65139787642%26matchtype%3De%26network%3Dg%26source%3Dnotmobile%26search_or_content%3Ds%26device%3Dc%26devicemodel%3D%26adposition%3D%26target%3D%26targetid%3Dkwd-1409285535%26loc_physical_ms%3D1011086%26loc_interest_ms%3D%26feeditemid%3D%26param1%3D%26param2%3D&gclid=EAIaIQobChMIlbDurbeg9gIVi5BoCR2VAwZTEAAYASAAEgI4A_D_BwE" target="_blank">Signup with Facebook</a>
             </div>
            </div>
            <!-- Para  -->
              <p>-OR-</p>
              <!-- Form, Input & Button -->
                <form action="#">
                    <div class="name">
                        <input type="text" name="name" id="name" placeholder="Full Name">
                    </div>
                    <div class="email">
                        <input type="email" name="email" id="email" placeholder="Email">
                    </div>
                    <div class="password">
                        <input type="password" name="password" id="password" placeholder="Password"><i class="fa-solid fa-lock"></i>
                        <br /> 
                    </div>
                        <button type="submit">Create Account</button>
                </form>
                <!-- pre & Anchor -->
                <pre>Already have an a Acount? <a href="#">Login</a></pre>
            </div>
        </div>
    </div>
    
</body>
</html>
